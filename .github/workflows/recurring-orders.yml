name: FreshPrep recurring order materializer

on:
  # Best-effort runs in Asia/Kolkata before the two configured delivery cutoffs:
  # 10:35 IST for same-day afternoon orders; 22:35 IST for next-day morning orders.
  schedule:
    - cron: '5 5 * * *'
    - cron: '5 17 * * *'
  workflow_dispatch:
    inputs:
      delivery_date:
        description: 'Optional YYYY-MM-DD override (otherwise derived from the schedule time in Asia/Kolkata)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: freshprep-recurring-${{ github.event.schedule || inputs.delivery_date || 'manual' }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.FRESHPREP_DATABASE_URL }}
      PRODUCER_ORG_ID: ${{ secrets.FRESHPREP_PRODUCER_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate scheduler configuration and derive delivery date
        id: target
        shell: bash
        env:
          DELIVERY_DATE_OVERRIDE: ${{ inputs.delivery_date }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ] || [ -z "${PRODUCER_ORG_ID}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Recurring order generation is paused until FRESHPREP_DATABASE_URL and FRESHPREP_PRODUCER_ORG_ID are configured."
              exit 0
            fi
            echo "::error::Configure FRESHPREP_DATABASE_URL and FRESHPREP_PRODUCER_ORG_ID repository secrets before running manually."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          if [ -n "$DELIVERY_DATE_OVERRIDE" ]; then
            delivery_date="$DELIVERY_DATE_OVERRIDE"
          elif [ "$SCHEDULE_CRON" = "5 17 * * *" ]; then
            delivery_date="$(TZ=Asia/Kolkata date -d 'tomorrow' +%F)"
          else
            delivery_date="$(TZ=Asia/Kolkata date +%F)"
          fi
          if ! [[ "${delivery_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Delivery date must use YYYY-MM-DD."
            exit 1
          fi
          echo "delivery_date=${delivery_date}" >> "$GITHUB_OUTPUT"
          echo "Target delivery date: ${delivery_date} (Asia/Kolkata)"
      - name: Install workspace dependencies
        if: steps.target.outputs.enabled == 'true'
        run: npm install --include=dev --no-audit --no-fund
      - name: Materialize due recurring orders
        if: steps.target.outputs.enabled == 'true'
        env:
          DELIVERY_DATE: ${{ steps.target.outputs.delivery_date }}
        run: npm run recurrence:run --workspace @freshprep/api
